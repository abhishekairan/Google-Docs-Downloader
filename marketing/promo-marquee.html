<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Marquee 1400×560</title>
<link rel="stylesheet" href="../popup.css">
<link rel="stylesheet" href="marketing.css">
<style> html, body { width: auto; } </style>
</head>
<body>
<div class="stage s1400">
  <div class="blob b1"></div><div class="blob b2"></div>
  <div class="tile" style="padding: 0 80px; gap: 40px; width: 900px">
    <img class="icon" src="../icons/icon128.png" width="128" height="128" alt="">
    <div>
      <div class="name" style="font-size:46px">Tab Downloader<br>for Google Docs</div>
      <div class="tag" style="font-size:20px; max-width:560px; margin-top:14px">Pick any tabs of a Google Doc and download each as its own PDF, Word, Markdown, text or HTML file. One click. Nothing leaves your browser.</div>
      <div class="chips-demo" style="margin-top:20px"><span class="on">.pdf</span><span class="on">.docx</span><span>.odt</span><span>.rtf</span><span>.txt</span><span class="on">.md</span><span>.html</span><span>.epub</span></div>
    </div>
  </div>
  <div class="popup-anchor" id="popup" style="right:80px; top:34px; transform: scale(0.92); transform-origin: top right"></div>
</div>
<script src="mock.js"></script>
<script>
  const tabs = [
    { title: 'Overview', checked: false, current: true },
    { title: 'Research', checked: true },
    { title: 'User interviews', level: 1, checked: true },
    { title: 'Requirements', checked: true },
    { title: 'Roadmap', checked: false },
    { title: 'Launch plan', checked: true },
  ];
  renderMockPopup(document.getElementById('popup'), { view: 'select', doc: 'Product Requirements', tabs, formats: ['pdf', 'md'], options: { open: false } });
</script>
</body>
</html>
